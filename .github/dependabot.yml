# Weekly update PRs for the pinned dependencies: Python (requirements.txt), the Docker base image digest and the
# GitHub Actions commit SHAs. CI runs the tests and pip-audit on each.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule: { interval: weekly }
    groups:
      python: { patterns: ["*"] }
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
